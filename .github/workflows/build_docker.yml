---
name: Publish Docker image
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docker_build/**'
      - '.github/workflows/build_docker.yml'
    tags:
      - "v*"
  pull_request:
    paths:
      - 'docker_build/**'
      - '.github/workflows/build_docker.yml'
  schedule:
    # Offset from docker-coder-workspace (20:30 Sun), -php (20:45 Sun), and
    # -vorrent (21:00 Sun) so the base rebuilds first and the playwright
    # extender picks up any new base layers.
    - cron: '15 21 * * 0'
  workflow_dispatch:
    inputs:
      check_only:
        description: Build and smoke-test without pushing
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build_and_push:
    name: Build and push workspace-playwright image
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    concurrency:
      group: "coder-workspace-playwright:${{ github.ref_name }}"
      cancel-in-progress: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/haakco/coder-workspace-playwright
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v0.') == false && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Clear stale Docker Hub credentials
        run: |
          # Runner pods mount docker-registry-credential which includes Docker Hub auth.
          # Bad Docker Hub creds block ALL public image pulls (docker/dockerfile, ubuntu, etc).
          # Remove Docker Hub entry so Docker falls back to anonymous access for public images.
          if [ -f ~/.docker/config.json ]; then
            python3 -c "
          import json, sys
          with open(sys.argv[1], 'r') as f: cfg = json.load(f)
          auths = cfg.get('auths', {})
          for key in list(auths.keys()):
              if 'docker.io' in key: del auths[key]
          with open(sys.argv[1], 'w') as f: json.dump(cfg, f, indent=2)
          " ~/.docker/config.json
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner exports HAAKCO_GITHUB_TOKEN from the github-token Secret in the
      # github-actions namespace (terraform/tf-home/032_github_actions, sourced from
      # Infisical /registry). Nothing in this repository can read that secret, so the
      # credential is verified here instead of assumed: an unauthenticated GitHub call
      # shares the estate's 60-requests-per-hour-per-IP budget, and the base image went
      # eight days without publishing (2026-09-17 to 2026-09-25) because that failure
      # surfaced only as a 403 inside one unrelated build layer.
      #
      # This gates the workflow, not the build steps: a Dockerfile RUN does not inherit
      # the runner environment, so every layer that talks to GitHub must also mount the
      # github_token build secret - see the CLI refresh layer in this image's Dockerfile.
      - name: Verify GitHub authentication
        run: |
          set -euo pipefail
          if [ -z "${HAAKCO_GITHUB_TOKEN:-}" ]; then
            echo "HAAKCO_GITHUB_TOKEN is not set on this runner; its owner is terraform/tf-home/032_github_actions" >&2
            exit 1
          fi
          limit="$(curl -fsS -H "Authorization: Bearer ${HAAKCO_GITHUB_TOKEN}" \
            https://api.github.com/rate_limit \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["rate"]["limit"])' 2>/dev/null)" || limit=""
          case "${limit}" in
            ''|*[!0-9]*)
              echo "GitHub API did not answer as an authenticated caller (limit=${limit:-none})" >&2
              exit 1
              ;;
          esac
          if [ "${limit}" -lt 1000 ]; then
            echo "GitHub API is on the anonymous budget: ${limit} requests/hour" >&2
            exit 1
          fi
          echo "GitHub API authenticated: ${limit} requests/hour"

      # Builds run on the cluster's shared BuildKit, not the runner's local dind
      # daemon.
      #
      # The dind bridge in the runner pod is MTU 1500 while the pod network is 1450,
      # so packets larger than 1450 bytes are black-holed inside build containers:
      # bulk transfers stall and then reset after roughly 150s. Measured here, the
      # same GitHub fetch that hung for 80s inside dind completed in 2.4s on the
      # cluster BuildKit, which sits on the cluster's own network.
      #
      # The script and the values it reads come from the runner, not from this repo:
      # terraform sets BUILDX_BUILDER_NAME and BUILDX_CLUSTER_ENDPOINTS from the
      # BuildKit service it creates, and the script selects that builder with --use.
      # That is why the build steps below name no --builder and why adding a second
      # BuildKit replica needs no change here.
      - name: Register the cluster BuildKit builder
        run: |
          set -euo pipefail
          # setup-buildx.sh ships on PATH in the runner image. The path this replaced,
          # /home/runner/buildx-cluster/setup-buildx-cluster.sh, is a ConfigMap that only the
          # DinD lane mounts (terraform/tf-home/032_github_actions/040_runner_config.tf), so it
          # does not exist on the containerd lane.
          setup-buildx.sh
        shell: bash

      - name: Build (check only, no push)
        if: ${{ github.event_name == 'pull_request' || inputs.check_only == true }}
        run: |
          docker buildx build \
            --secret id=github_token,env=HAAKCO_GITHUB_TOKEN \
            --pull \
            --output type=cacheonly \
            --file ./docker_build/Dockerfile \
            --build-arg BASE_IMAGE_NAME=ghcr.io/haakco/coder-workspace \
            --build-arg BASE_IMAGE_VERSION=latest \
            --cache-from type=registry,ref=ghcr.io/haakco/coder-workspace-playwright:buildcache \
            .

      - name: Build and push Docker image
        if: ${{ github.event_name != 'pull_request' && inputs.check_only != true }}
        run: |
          # Build tag arguments from metadata output
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=(--tag "$tag")
          done <<< "$DOCKER_TAGS"

          docker buildx build \
            --secret id=github_token,env=HAAKCO_GITHUB_TOKEN \
            --pull \
            --push \
            --file ./docker_build/Dockerfile \
            --build-arg BASE_IMAGE_NAME=ghcr.io/haakco/coder-workspace \
            --build-arg BASE_IMAGE_VERSION=latest \
            --cache-from type=registry,ref=ghcr.io/haakco/coder-workspace-playwright:buildcache \
            --cache-to type=registry,ref=ghcr.io/haakco/coder-workspace-playwright:buildcache,mode=max \
            "${TAG_ARGS[@]}" \
            .
        shell: bash
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}

      # The smoke assertions that used to run here as a separate post-build step now execute
      # inside the image build itself: see the smoke RUN at the end of docker_build/Dockerfile.
      # The containerd lane has no Docker daemon, and running them in the build makes them cover
      # the publish path too, so an image can no longer be published without them.
