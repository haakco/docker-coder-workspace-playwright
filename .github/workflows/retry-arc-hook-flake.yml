---
name: Retry ARC container-hook flakes

# ---------------------------------------------------------------------------------------------
#
# The ARC Kubernetes container hook occasionally marks a successful job as failed during post-job
# cleanup:
#
#   Run '/home/runner/k8s/index.js'
#   TypeError: Converting circular structure to JSON
#   Executing the custom container implementation failed.
#
# That is actions/runner-container-hooks issue #329, fixed by PR #364 (merge commit
# d170a93f70f3, 2026-06-05) but not released - the newest release is still v0.8.1, which predates
# it. Until it ships, a re-run is the workaround, and it demonstrably works: haakco-web-test-runner
# run 35287944278 failed attempt 1 on exactly this and passed attempt 2 with no code change.
#
# haakco/prod-infra .github/workflows/watch-arc-container-hook-fix.yml fails loudly when a release
# finally contains the fix, so this whole workaround can then be deleted deliberately.
#
# SAFETY: it re-runs ONLY when every failed job in the run matches one of the two exact hook
# signatures. One unfamiliar failure anywhere and it does nothing but say so. It must never mask
# a genuine failure - it will not match a real test failure, a dependency error, or the lane's
# Pending-pod capacity symptom.

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows:
      - Publish Docker image
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID to inspect. Only used when dispatching by hand.
        type: string
        required: false

permissions:
  actions: write
  contents: read

# Job containers on the containerd lane default to dash; this workflow uses pipefail, which needs
# bash. The lane migration work hit this on four workflows before it was written down.
defaults:
  run:
    shell: bash

jobs:
  retry:
    name: Inspect the failed run and re-run it if it is only the hook flake
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Work out which run to inspect
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.run_id }}" ]; then
            run_id="${{ inputs.run_id }}"
          else
            run_id="${{ github.event.workflow_run.id }}"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No run id available; nothing to do."
            echo "skip=missing-run-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attempt="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.run_attempt')"
          conclusion="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.conclusion')"
          {
            echo "run_id=${run_id}"
            echo "attempt=${attempt}"
            echo "conclusion=${conclusion}"
          } >> "$GITHUB_OUTPUT"
          printf 'Run %s: attempt=%s conclusion=%s\n' "$run_id" "$attempt" "$conclusion"

      - name: Only ever retry a first attempt that failed
        id: gate
        if: steps.target.outputs.skip == ''
        run: |
          set -euo pipefail
          # A run that has already been re-run is never re-run again, however it failed. This is
          # what stops this workflow looping on a job that fails every single time.
          if [ "${{ steps.target.outputs.attempt }}" != "1" ]; then
            echo "Already at attempt ${{ steps.target.outputs.attempt }}; not retrying."
            echo "skip=already-retried" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.target.outputs.conclusion }}" != "failure" ]; then
            echo "Conclusion is ${{ steps.target.outputs.conclusion }}; nothing to retry."
            echo "skip=not-a-failure" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify every failed job in the run
        id: classify
        if: steps.gate.outputs.skip == ''
        run: |
          set -euo pipefail
          run_id="${{ steps.target.outputs.run_id }}"

          mapfile -t failed < <(
            gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'
          )
          echo "Failed jobs: ${#failed[@]}"
          if [ "${#failed[@]}" -eq 0 ]; then
            echo "No failed jobs to classify."
            echo "verdict=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deliberately exact and deliberately short: a broad pattern here would re-run genuine
          # failures and hide real breakage.
          pattern='TypeError: Converting circular structure to JSON|Executing the custom container implementation failed'

          flake=0
          other=0
          for job_id in "${failed[@]}"; do
            name="$(gh api "repos/${REPO}/actions/jobs/${job_id}" --jq '.name')"
            log="$(gh api "repos/${REPO}/actions/jobs/${job_id}/logs" 2>/dev/null || true)"
            if printf '%s' "$log" | grep -qE "$pattern"; then
              printf '  FLAKE     %s\n' "$name"
              flake=$((flake + 1))
            else
              printf '  NOT-FLAKE %s\n' "$name"
              other=$((other + 1))
            fi
          done

          printf 'flake=%s other=%s\n' "$flake" "$other"
          if [ "$other" -gt 0 ]; then
            echo "verdict=mixed" >> "$GITHUB_OUTPUT"
          elif [ "$flake" -gt 0 ]; then
            echo "verdict=flake-only" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain the decision
        if: steps.gate.outputs.skip == '' && steps.classify.outputs.verdict != 'flake-only'
        run: |
          set -euo pipefail
          if [ "${{ steps.classify.outputs.verdict }}" = "mixed" ]; then
            echo "::warning title=Not retrying::At least one failed job is not the ARC hook flake. That is a real failure and needs a look, not a re-run."
          else
            echo "Nothing to do - no failed job matches the ARC hook flake."
          fi

      - name: Re-run the failed jobs
        if: steps.classify.outputs.verdict == 'flake-only'
        run: |
          set -euo pipefail
          run_id="${{ steps.target.outputs.run_id }}"
          echo "::notice title=Retrying::Every failed job is the ARC hook flake; re-running run ${run_id}."
          gh run rerun "$run_id" --repo "$REPO" --failed
          {
            echo "## Re-ran ${REPO} run ${run_id}"
            echo
            echo "Every failed job matched the ARC container-hook flake"
            echo "(actions/runner-container-hooks#329), so the failed jobs were re-run. This is the"
            echo "documented workaround while the upstream fix is unreleased; see"
            echo "haakco/prod-infra .github/workflows/watch-arc-container-hook-fix.yml."
            echo
            echo "https://github.com/${REPO}/actions/runs/${run_id}"
          } >> "$GITHUB_STEP_SUMMARY"
